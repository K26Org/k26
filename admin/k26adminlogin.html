<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login</title>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f7fb;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .login-card {
            width: 100%;
            max-width: 400px;
            background: #fff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.08);
        }

            .login-card h2 {
                text-align: center;
                margin-bottom: 30px;
                color: #333;
            }

        .form-group {
            margin-bottom: 18px;
        }

            .form-group label {
                display: block;
                margin-bottom: 8px;
                color: #444;
                font-size: 14px;
            }

        .form-control {
            width: 100%;
            padding: 12px;
            border: 1px solid #dcdcdc;
            border-radius: 8px;
            outline: none;
            transition: 0.2s;
        }

            .form-control:focus {
                border-color: #2563eb;
            }

        .btn-login {
            width: 100%;
            padding: 12px;
            border: none;
            background: #2563eb;
            color: white;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
            transition: 0.2s;
        }

            .btn-login:hover {
                background: #1d4ed8;
            }

        .loading {
            display: none;
            text-align: center;
            margin-top: 15px;
            color: #2563eb;
        }

        .error-msg {
            display: none;
            background: #ffe5e5;
            color: #d10000;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .success-msg {
            display: none;
            background: #e8ffea;
            color: #008a1f;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            font-size: 14px;
        }

        .user-box {
            display: none;
            text-align: center;
        }

            .user-box h3 {
                margin-bottom: 10px;
            }

        .logout-btn {
            margin-top: 20px;
            background: #dc2626;
        }

            .logout-btn:hover {
                background: #b91c1c;
            }
    </style>
</head>
<body>

    <div class="login-card">

        <!-- LOGIN FORM -->
        <div id="loginSection">

            <h2>Login</h2>

            <div class="error-msg" id="errorMsg"></div>
            <div class="success-msg" id="successMsg"></div>

            <div class="form-group">
                <label>Email</label>
                <input type="email" id="email" class="form-control" />
            </div>

            <div class="form-group">
                <label>Password</label>
                <input type="password" id="password" class="form-control" />
            </div>

            <button class="btn-login" id="btnLogin">
                Login
            </button>

            <div class="loading" id="loading">
                Please wait...
            </div>

        </div>

        <!-- USER INFO -->
        <div class="user-box" id="userSection">

            <h3>Welcome</h3>

            <p>
                <strong>Name:</strong>
                <span id="userName"></span>
            </p>

            <p>
                <strong>Email:</strong>
                <span id="userEmail"></span>
            </p>

            <button class="btn-login logout-btn" id="btnLogout">
                Logout
            </button>

        </div>

    </div>

    <script>

        // =========================
        // CONFIG
        // =========================

        const API_URL = "https://k26api.runasp.net/api/";

        // =========================
        // CHECK LOGIN
        // =========================

        $(document).ready(function () {

            //let user = localStorage.getItem("user");

            //if (user) {
            //    var originUrl = window.location.origin;
            //    location.href = originUrl + "/k26requestlist.html";
            //}

        });

        // =========================
        // LOGIN
        // =========================

        $("#btnLogin").click(function () {

            const email = $("#email").val().trim();
            const password = $("#password").val().trim();

            $("#errorMsg").hide();
            $("#successMsg").hide();

            if (email === "" || password === "") {

                $("#errorMsg")
                    .text("Email and password are required.")
                    .show();

                return;
            }

            $("#loading").show();

            $.ajax({

                url: API_URL + "Login/K26AdminLogin",
                method: "POST",
                contentType: "application/json",

                data: JSON.stringify({
                    email: email,
                    password: password
                }),

                success: function (res) {

                    $("#loading").hide();

                    /*

                     Expected API Response:

                     {
                        "success": true,
                        "token": "jwt-token",
                        "user": {
                            "id": 1,
                            "name": "John",
                            "email": "john@gmail.com"
                        }
                     }

                    */

                    if (res.success) {

                        // SAVE TOKEN
                        localStorage.setItem("usercode", res.data.code);

                        // SAVE USER
                        localStorage.setItem(
                            "user",
                            JSON.stringify(res.data.user)
                        );

                        $("#successMsg")
                            .text("Login successful.")
                            .show();

                        var originUrl = window.location.origin;
                        location.href = originUrl+"/k26requestlist.html";

                    } else {

                        $("#errorMsg")
                            .text(res.message || "Login failed.")
                            .show();
                    }

                },

                error: function (xhr) {

                    $("#loading").hide();

                    let msg = "Login failed.";

                    if (xhr.responseJSON?.message) {
                        msg = xhr.responseJSON.message;
                    }

                    $("#errorMsg")
                        .text(msg)
                        .show();
                }

            });

        });

        // =========================
        // SHOW USER
        // =========================

        function showUser(user) {

            $("#loginSection").hide();

            $("#userSection").show();

            $("#userName").text(user.name);
            $("#userEmail").text(user.email);
        }

        // =========================
        // LOGOUT
        // =========================

        $("#btnLogout").click(function () {

            localStorage.removeItem("token");
            localStorage.removeItem("user");

            location.reload();

        });

    </script>

</body>
</html>
